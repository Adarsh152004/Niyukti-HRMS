apiVersion: v1
kind: ConfigMap
metadata:
  name: hrms-config
  namespace: hrms-production
data:
  APP_ENV: "production"
  PORT: "8000"
  REDIS_URL: "redis://hrms-redis-service:6379/0"
  DATABASE_URL: "postgresql+asyncpg://hrms_user:hrms_secure_password_2026@hrms-postgres-service:5432/hrms_db"
---
apiVersion: v1
kind: Secret
metadata:
  name: hrms-secrets
  namespace: hrms-production
type: Opaque
stringData:
  JWT_SECRET_KEY: "enterprise_jwt_production_secret_key_hrms_2026_super_secure"
  API_KEY_SALT: "hrms_enterprise_api_key_salt_2026"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hrms-postgres
  namespace: hrms-production
spec:
  serviceName: hrms-postgres-service
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hrms-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hrms-postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: hrms_db
            - name: POSTGRES_USER
              value: hrms_user
            - name: POSTGRES_PASSWORD
              value: hrms_secure_password_2026
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Gi
---
apiVersion: v1
kind: Service
metadata:
  name: hrms-postgres-service
  namespace: hrms-production
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hrms-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hrms-redis
  namespace: hrms-production
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hrms-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hrms-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
---
apiVersion: v1
kind: Service
metadata:
  name: hrms-redis-service
  namespace: hrms-production
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hrms-redis
  ports:
    - port: 6379
      targetPort: 6379
