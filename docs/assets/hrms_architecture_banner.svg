<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    
    <!-- Accent Glows -->
    <radialGradient id="cyanGlow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleGlow" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="indigoGlow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F2937" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="activeCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>
    
    <!-- Badge & Border Gradients -->
    <linearGradient id="cyanBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="purpleBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="emeraldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="amberBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#38BDF8" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="520" fill="url(#bgGrad)" rx="16"/>
  <rect width="1200" height="520" fill="url(#cyanGlow)" rx="16"/>
  <rect width="1200" height="520" fill="url(#purpleGlow)" rx="16"/>
  <rect width="1200" height="520" fill="url(#indigoGlow)" rx="16"/>

  <!-- Subtle Grid Pattern -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="520" stroke-dasharray="4 8"/>
    <line x1="300" y1="0" x2="300" y2="520" stroke-dasharray="4 8"/>
    <line x1="500" y1="0" x2="500" y2="520" stroke-dasharray="4 8"/>
    <line x1="700" y1="0" x2="700" y2="520" stroke-dasharray="4 8"/>
    <line x1="900" y1="0" x2="900" y2="520" stroke-dasharray="4 8"/>
    <line x1="1100" y1="0" x2="1100" y2="520" stroke-dasharray="4 8"/>
    <line x1="0" y1="100" x2="1200" y2="100" stroke-dasharray="4 8"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke-dasharray="4 8"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke-dasharray="4 8"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke-dasharray="4 8"/>
  </g>

  <!-- TOP HEADER -->
  <g transform="translate(60, 48)">
    <rect x="0" y="0" width="136" height="28" rx="14" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2"/>
    <circle cx="14" cy="14" r="5" fill="#38BDF8"/>
    <text x="26" y="18" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">ENTERPRISE 2026</text>
    
    <text x="0" y="62" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">
      NIYUKTI HRMS <tspan fill="#38BDF8">Intelligence OS</tspan>
    </text>
    <text x="0" y="86" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      Autonomous Multi-Agent Orchestration • 3-Stage Recruitment Pipelines • Gmail MCP • WhatsApp HITL
    </text>
  </g>

  <!-- COLUMN 1: Client Interfaces (Left) -->
  <g transform="translate(60, 160)">
    <!-- Header -->
    <text x="0" y="0" fill="#64748B" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">FRONTEND CLIENT PORTALS</text>
    
    <!-- Portal 1: HRMS Web -->
    <g transform="translate(0, 14)">
      <rect width="260" height="68" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
      <circle cx="28" cy="34" r="14" fill="#0369A1" fill-opacity="0.4"/>
      <text x="28" y="38" text-anchor="middle" fill="#38BDF8" font-family="sans-serif" font-size="14">💻</text>
      <text x="52" y="28" fill="#F1F5F9" font-family="sans-serif" font-size="13" font-weight="700">HRMS Enterprise Web</text>
      <text x="52" y="44" fill="#94A3B8" font-family="sans-serif" font-size="11">React 19 + TS (Port 5185)</text>
      <rect x="52" y="50" width="76" height="12" rx="6" fill="#0C4A6E"/>
      <text x="90" y="59" text-anchor="middle" fill="#38BDF8" font-family="sans-serif" font-size="8" font-weight="600">ADMIN / HR</text>
    </g>

    <!-- Portal 2: Employee Portal -->
    <g transform="translate(0, 94)">
      <rect width="260" height="68" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
      <circle cx="28" cy="34" r="14" fill="#047857" fill-opacity="0.4"/>
      <text x="28" y="38" text-anchor="middle" fill="#34D399" font-family="sans-serif" font-size="14">👤</text>
      <text x="52" y="28" fill="#F1F5F9" font-family="sans-serif" font-size="13" font-weight="700">Employee Self-Service</text>
      <text x="52" y="44" fill="#94A3B8" font-family="sans-serif" font-size="11">Leave, Punch &amp; Payslips (Port 5175)</text>
      <rect x="52" y="50" width="80" height="12" rx="6" fill="#064E3B"/>
      <text x="92" y="59" text-anchor="middle" fill="#34D399" font-family="sans-serif" font-size="8" font-weight="600">EMPLOYEE</text>
    </g>

    <!-- Portal 3: CEO Mobile Chat -->
    <g transform="translate(0, 174)">
      <rect width="260" height="68" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
      <circle cx="28" cy="34" r="14" fill="#B45309" fill-opacity="0.4"/>
      <text x="28" y="38" text-anchor="middle" fill="#FBBF24" font-family="sans-serif" font-size="14">📱</text>
      <text x="52" y="28" fill="#F1F5F9" font-family="sans-serif" font-size="13" font-weight="700">CEO Mobile WhatsApp App</text>
      <text x="52" y="44" fill="#94A3B8" font-family="sans-serif" font-size="11">WhatsApp Native UI (Port 5174)</text>
      <rect x="52" y="50" width="70" height="12" rx="6" fill="#78350F"/>
      <text x="87" y="59" text-anchor="middle" fill="#FBBF24" font-family="sans-serif" font-size="8" font-weight="600">EXECUTIVE</text>
    </g>

    <!-- Portal 4: Azyntrix Talent -->
    <g transform="translate(0, 254)">
      <rect width="260" height="68" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
      <circle cx="28" cy="34" r="14" fill="#6D28D9" fill-opacity="0.4"/>
      <text x="28" y="38" text-anchor="middle" fill="#C084FC" font-family="sans-serif" font-size="14">✨</text>
      <text x="52" y="28" fill="#F1F5F9" font-family="sans-serif" font-size="13" font-weight="700">Azyntrix Talent Suite</text>
      <text x="52" y="44" fill="#94A3B8" font-family="sans-serif" font-size="11">Careers &amp; Admin (Port 5180)</text>
      <rect x="52" y="50" width="80" height="12" rx="6" fill="#4C1D95"/>
      <text x="92" y="59" text-anchor="middle" fill="#C084FC" font-family="sans-serif" font-size="8" font-weight="600">CANDIDATE/HR</text>
    </g>
  </g>

  <!-- COLUMN 2: Central Orchestration Engine (Center) -->
  <g transform="translate(360, 160)">
    <text x="0" y="0" fill="#64748B" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">INTELLIGENCE CONTROL PLANE</text>

    <!-- Main Engine Box -->
    <g transform="translate(0, 14)">
      <rect width="480" height="308" rx="14" fill="url(#activeCardGrad)" stroke="url(#purpleBorder)" stroke-width="1.6" filter="url(#glowShadow)"/>
      
      <!-- Engine Header -->
      <path d="M 0 14 Q 0 0 14 0 L 466 0 Q 480 0 480 14 L 480 44 L 0 44 Z" fill="#1E1B4B" fill-opacity="0.8"/>
      <circle cx="20" cy="22" r="6" fill="#A855F7"/>
      <text x="34" y="26" fill="#F8FAFC" font-family="sans-serif" font-size="13" font-weight="800">🧠 LangGraph Multi-Agent Fabric &amp; FastAPI Gateway</text>
      <rect x="380" y="14" width="86" height="18" rx="9" fill="#581C87"/>
      <text x="423" y="26" text-anchor="middle" fill="#E9D5FF" font-family="sans-serif" font-size="9" font-weight="700">PORT 8000</text>

      <!-- Sub-Component 1: ReAct DAG & Router -->
      <g transform="translate(18, 56)">
        <rect width="216" height="74" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
        <text x="12" y="20" fill="#38BDF8" font-family="sans-serif" font-size="11" font-weight="700">1. Intent &amp; DAG Router</text>
        <text x="12" y="38" fill="#94A3B8" font-family="sans-serif" font-size="10">Groq / Gemini / Mistral LLMs</text>
        <text x="12" y="54" fill="#64748B" font-family="sans-serif" font-size="9">Dynamic multi-turn tool calling</text>
      </g>

      <!-- Sub-Component 2: HITL Safety Engine -->
      <g transform="translate(246, 56)">
        <rect width="216" height="74" rx="8" fill="#111827" stroke="#F59E0B" stroke-width="1"/>
        <text x="12" y="20" fill="#FBBF24" font-family="sans-serif" font-size="11" font-weight="700">2. Human-in-the-Loop (HITL)</text>
        <text x="12" y="38" fill="#94A3B8" font-family="sans-serif" font-size="10">14 Critical Action Approval Gates</text>
        <text x="12" y="54" fill="#64748B" font-family="sans-serif" font-size="9">Offers • Deletes • Email triggers</text>
      </g>

      <!-- Sub-Component 3: 7 HR Core Specialized Agents -->
      <g transform="translate(18, 140)">
        <rect width="444" height="78" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
        <text x="12" y="20" fill="#34D399" font-family="sans-serif" font-size="11" font-weight="700">3. 7 Specialized HR Core Agents + Azyntrix ReAct Node</text>
        <g transform="translate(12, 30)">
          <!-- Badges -->
          <rect x="0" y="0" width="76" height="18" rx="4" fill="#064E3B"/><text x="38" y="12" text-anchor="middle" fill="#6EE7B7" font-family="sans-serif" font-size="9">👤 Employee</text>
          <rect x="82" y="0" width="82" height="18" rx="4" fill="#064E3B"/><text x="123" y="12" text-anchor="middle" fill="#6EE7B7" font-family="sans-serif" font-size="9">⏱️ Attendance</text>
          <rect x="170" y="0" width="60" height="18" rx="4" fill="#064E3B"/><text x="200" y="12" text-anchor="middle" fill="#6EE7B7" font-family="sans-serif" font-size="9">🏖️ Leave</text>
          <rect x="236" y="0" width="64" height="18" rx="4" fill="#064E3B"/><text x="268" y="12" text-anchor="middle" fill="#6EE7B7" font-family="sans-serif" font-size="9">💵 Payroll</text>
          <rect x="306" y="0" width="114" height="18" rx="4" fill="#064E3B"/><text x="363" y="12" text-anchor="middle" fill="#6EE7B7" font-family="sans-serif" font-size="9">🎯 Recruitment</text>
          
          <rect x="0" y="22" width="94" height="18" rx="4" fill="#064E3B"/><text x="47" y="34" text-anchor="middle" fill="#6EE7B7" font-family="sans-serif" font-size="9">📈 Performance</text>
          <rect x="100" y="22" width="76" height="18" rx="4" fill="#064E3B"/><text x="138" y="34" text-anchor="middle" fill="#6EE7B7" font-family="sans-serif" font-size="9">📜 Policy RAG</text>
          <rect x="182" y="22" width="138" height="18" rx="4" fill="#4C1D95"/><text x="251" y="34" text-anchor="middle" fill="#DDD6FE" font-family="sans-serif" font-size="9">✨ Azyntrix Talent Node</text>
        </g>
      </g>

      <!-- Sub-Component 4: 3-Stage Candidate Workflow -->
      <g transform="translate(18, 228)">
        <rect width="444" height="66" rx="8" fill="#0F172A" stroke="#0284C7" stroke-width="1"/>
        <text x="12" y="18" fill="#38BDF8" font-family="sans-serif" font-size="10" font-weight="700">4. 3-STAGE RECRUITMENT AUTOMATION SEQUENCE</text>
        <g transform="translate(12, 26)">
          <text x="0" y="12" fill="#E2E8F0" font-family="sans-serif" font-size="10">Stage 1: Invite</text>
          <text x="96" y="12" fill="#64748B" font-family="sans-serif" font-size="10">→</text>
          <text x="114" y="12" fill="#E2E8F0" font-family="sans-serif" font-size="10">Stage 2: Scorecard</text>
          <text x="228" y="12" fill="#64748B" font-family="sans-serif" font-size="10">→</text>
          <text x="246" y="12" fill="#E2E8F0" font-family="sans-serif" font-size="10">Stage 3: Offer Letter &amp; Kit</text>
          <text x="0" y="28" fill="#0EA5E9" font-family="sans-serif" font-size="9" font-weight="600">⚡ Auto-Dispatched via Gmail MCP + WhatsApp to CEO</text>
        </g>
      </g>
    </g>
  </g>

  <!-- COLUMN 3: Integrations & Storage (Right) -->
  <g transform="translate(880, 160)">
    <text x="0" y="0" fill="#64748B" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">INTEGRATIONS &amp; STORAGE</text>

    <!-- Integration 1: Google Workspace / Gmail MCP -->
    <g transform="translate(0, 14)">
      <rect width="260" height="68" rx="10" fill="url(#cardGrad)" stroke="#EF4444" stroke-width="1" stroke-opacity="0.6" filter="url(#shadow)"/>
      <circle cx="28" cy="34" r="14" fill="#991B1B" fill-opacity="0.4"/>
      <text x="28" y="38" text-anchor="middle" fill="#F87171" font-family="sans-serif" font-size="14">📧</text>
      <text x="52" y="28" fill="#F1F5F9" font-family="sans-serif" font-size="13" font-weight="700">Gmail MCP Integration</text>
      <text x="52" y="44" fill="#94A3B8" font-family="sans-serif" font-size="10">OAuth2 Live Email Dispatch</text>
      <text x="52" y="58" fill="#EF4444" font-family="sans-serif" font-size="9" font-weight="600">RFC 2822 Templates</text>
    </g>

    <!-- Integration 2: WhatsApp & Multi-Channel Router -->
    <g transform="translate(0, 94)">
      <rect width="260" height="68" rx="10" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1" stroke-opacity="0.6" filter="url(#shadow)"/>
      <circle cx="28" cy="34" r="14" fill="#065F46" fill-opacity="0.4"/>
      <text x="28" y="38" text-anchor="middle" fill="#34D399" font-family="sans-serif" font-size="14">💬</text>
      <text x="52" y="28" fill="#F1F5F9" font-family="sans-serif" font-size="13" font-weight="700">Multi-Channel Router</text>
      <text x="52" y="44" fill="#94A3B8" font-family="sans-serif" font-size="10">WhatsApp Alerts + WebSockets</text>
      <text x="52" y="58" fill="#10B981" font-family="sans-serif" font-size="9" font-weight="600">CEO Direct Notifications</text>
    </g>

    <!-- Integration 3: Relational DB (SQLite / Postgres) -->
    <g transform="translate(0, 174)">
      <rect width="260" height="68" rx="10" fill="url(#cardGrad)" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.6" filter="url(#shadow)"/>
      <circle cx="28" cy="34" r="14" fill="#1E40AF" fill-opacity="0.4"/>
      <text x="28" y="38" text-anchor="middle" fill="#60A5FA" font-family="sans-serif" font-size="14">🗄️</text>
      <text x="52" y="28" fill="#F1F5F9" font-family="sans-serif" font-size="13" font-weight="700">Relational Ground Truth</text>
      <text x="52" y="44" fill="#94A3B8" font-family="sans-serif" font-size="10">hrms.db (SQLite) / PostgreSQL</text>
      <text x="52" y="58" fill="#60A5FA" font-family="sans-serif" font-size="9" font-weight="600">Employees, Logs, Payroll</text>
    </g>

    <!-- Integration 4: MongoDB Atlas Cloud -->
    <g transform="translate(0, 254)">
      <rect width="260" height="68" rx="10" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1" stroke-opacity="0.6" filter="url(#shadow)"/>
      <circle cx="28" cy="34" r="14" fill="#065F46" fill-opacity="0.4"/>
      <text x="28" y="38" text-anchor="middle" fill="#34D399" font-family="sans-serif" font-size="14">🍃</text>
      <text x="52" y="28" fill="#F1F5F9" font-family="sans-serif" font-size="13" font-weight="700">MongoDB Atlas Cloud</text>
      <text x="52" y="44" fill="#94A3B8" font-family="sans-serif" font-size="10">Database: 'azyntrix'</text>
      <text x="52" y="58" fill="#34D399" font-family="sans-serif" font-size="9" font-weight="600">Jobs, Resumes &amp; Pipelines</text>
    </g>
  </g>

  <!-- Connectors / Dynamic Flow Lines -->
  <g stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.4" fill="none" stroke-dasharray="4 4">
    <!-- Portals to Engine -->
    <path d="M 320 208 L 360 208"/>
    <path d="M 320 288 L 360 288"/>
    <path d="M 320 368 L 360 368"/>
    <path d="M 320 448 L 360 448"/>
    
    <!-- Engine to Integrations -->
    <path d="M 840 208 L 880 208"/>
    <path d="M 840 288 L 880 288"/>
    <path d="M 840 368 L 880 368"/>
    <path d="M 840 448 L 880 448"/>
  </g>
</svg>
